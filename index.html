<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xaque á meta</title>
<meta name="description" content="Carreira por quendas con pezas de xadrez">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe3c8;--panel:#e3d3ae;--ink:#2a1d14;--muted:#6d5a43;--line:#b9a47c;
  --btn:#d7c39a;--on:#2a1d14;--onInk:#f3e9d2;--gold:#a8740b;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#17111f;--panel:#241a30;--ink:#f3e9d2;--muted:#b9a98c;--line:#45365a;--btn:#33264a;--on:#f2c14e;--onInk:#17111f;--gold:#f2c14e;}
}
:root[data-theme="dark"]{--bg:#17111f;--panel:#241a30;--ink:#f3e9d2;--muted:#b9a98c;--line:#45365a;--btn:#33264a;--on:#f2c14e;--onInk:#17111f;--gold:#f2c14e;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Pixelify Sans",ui-monospace,Menlo,Consolas,monospace;font-size:16px}
#app{max-width:560px;height:100%;margin:0 auto;padding:6px 8px;display:flex;flex-direction:column;gap:5px}
#ctrl{flex:none;display:flex;flex-direction:column;gap:5px}
.hbtns{display:flex;gap:6px}
button.px.xs{padding:3px 8px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
header{display:flex;align-items:center;gap:8px;flex:none}
h1{font-size:19px;margin:0;line-height:1;white-space:nowrap}
.sub{font-size:12px;color:var(--muted);flex:none}
#app.playing .sub{display:none}
.flags{margin-left:auto;display:flex;gap:4px;flex-shrink:0}
.flag{border:2px solid transparent;padding:1px;background:none;cursor:pointer;line-height:0}
.flag.on{border-color:var(--ink)}
.flag svg{display:block}
#stage{flex:1 1 auto;min-height:120px;border:3px solid var(--ink);line-height:0;background:#2d4a24;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#cv{max-width:none;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:pan-y}
#status{font-size:14px;min-height:18px;line-height:1.25}
#roster{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:10px;font-size:12px;color:var(--muted);white-space:nowrap}
.pieces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pieces:empty{display:none}
button.px{font:inherit;font-size:15px;background:var(--btn);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 12px;cursor:pointer}
button.px:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button.px:disabled{opacity:.35;cursor:default}
button.px:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.px.on{background:var(--on);color:var(--onInk)}
button.px.sm{padding:6px 10px;font-size:14px}
.pbtn{display:flex;flex-direction:column;align-items:center;padding:2px 2px 3px;position:relative}
.pbtn img{width:26px;height:39px;image-rendering:pixelated}
.pbtn .nm{font-size:11px}
.badge{position:absolute;top:2px;right:4px;font-size:12px}
.hint{font-size:12px;color:var(--muted);margin-right:auto;align-self:center;line-height:1.2}
.actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;min-height:38px}
.actions .grow{margin-right:auto}
#pu{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
#pu:empty{display:none}
#pu .tag{border:2px solid var(--ink);padding:3px 8px;background:var(--panel)}
#log{font-size:12px;line-height:1.35;border-top:2px dashed var(--line);padding-top:4px;max-height:50px;overflow-y:auto}
.chip{display:inline-block;width:12px;height:12px;border:2px solid var(--ink);vertical-align:-1px;margin-right:4px}
.overlay{position:fixed;inset:0;background:rgba(10,6,16,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.overlay.show{display:flex}
#ovCurtain{background:var(--bg)}
.card{background:var(--panel);color:var(--ink);border:3px solid var(--ink);box-shadow:6px 6px 0 #000;max-width:440px;width:100%;padding:16px;max-height:100%;overflow:auto}
.card h2{margin:0 0 4px;font-size:24px}
.card .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.slot{display:flex;gap:8px;margin:8px 0}
.center{text-align:center}
.big{font-size:22px;margin:12px 0}
.card ol{padding-left:20px;margin:8px 0}
.card li{margin:6px 0;line-height:1.35}
@media (prefers-reduced-motion:reduce){button.px:active{transform:none}}
</style>
</head>

function buildSprite(def,color,SW,SH){

  for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){const px=x+.5,py=y+.5;let ins=false;
   if(o.s==='rect')ins=x>=o.x0&&x<=o.x1&&y>=o.y0&&y<=o.y1;
   else if(o.s==='ell')ins=((px-o.cx)/o.rx)**2+((py-o.cy)/o.ry)**2<=1;
   else if(o.s==='trap'){if(y>=o.y0&&y<=o.y1){const k=o.y1===o.y0?0:(y-o.y0)/(o.y1-o.y0);const hw=(o.w0+(o.w1-o.w0)*k)/2;const cx=o.cx==null?10:o.cx;ins=px>=cx-hw&&px<=cx+hw;}}

 }

 for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){const p=at(x,y);if(!p)continue;
  let L=x,R=x;while(at(L-1,y)===p)L--;while(at(R+1,y)===p)R++;

 }

function dirOf(fr,to){const dr=to.r-fr.r,dc=to.c-fr.c;if(dc<0)return 2;if(dc>0)return 3;if(dr<0)return 1;if(dr>0)return 0;return null;}
function faceAt(r,c){let best=null,bd=dist[r]&&dist[r][c];for(const [dr,dc] of [[-1,0],[0,-1],[0,1],[1,0]]){const nr=r+dr,nc=c+dc;if(inB(nr,nc)&&grid[nr][nc]!==0&&dist[nr][nc]<bd){bd=dist[nr][nc];best=dirOf({r,c},{r:nr,c:nc});}}return best==null?1:best;}

   if(ty==='P'&&!p.promoted&&d0>HALF&&dist[d.r][d.c]<=HALF)s+=2;
   if(s>bs){bs=s;best={type:ty,dest:{r:d.r,c:d.c}};}
   if(usable&&p.pu.t==='carga')movesFor(ty,d,EMPTY,{carga:true}).forEach(d2=>{if(d2.r===p.pos.r&&d2.c===p.pos.c)return;
    let s2=d0-val(ty,d2)-COST[ty]+Math.random()*1.6;if(attacksKing(ty,d2,EMPTY))s2+=1000;
    if(s2>bs){bs=s2;best={type:ty,dest:{r:d.r,c:d.c},dest2:{r:d2.r,c:d2.c}};}});
  });});
 best=best||{type:null,dest:{r:p.pos.r,c:p.pos.c}};
 if(usable&&p.pu.t==='enroque'){const j=enroqueTarget(p);if(j!=null&&d0-dOf(S.players[j])>=3)return {type:null,dest:{r:p.pos.r,c:p.pos.c},enroque:j};}
 if(usable&&p.pu.t==='derrumbe'){const q=S.players.filter(o=>o!==p&&dOf(o)<d0&&d0-dOf(o)<=12).sort((a,b)=>dOf(a)-dOf(b))[0];
  if(q){const c=holeTargets(p).filter(h=>dist[h.r][h.c]<dOf(q)).sort((a,b)=>Math.hypot(a.r-q.pos.r,a.c-q.pos.c)-Math.hypot(b.r-q.pos.r,b.c-q.pos.c));if(c.length)best.hole=c[0];}}
 return best;
}

function retreatFrom(pos,v,cur){const d0=dist[pos.r][pos.c],seen=new Set([key(pos.r,pos.c)]);let q=[pos];
 while(q.length){const nq=[];for(const p of q){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const r=p.r+dr,c=p.c+dc,k=key(r,c);
  if(seen.has(k)||!isOpen(r,c))continue;seen.add(k);if(dist[r][c]<d0)continue;
  if(dist[r][c]>d0&&!cur.some((o,j)=>j!==v&&o.on&&o.r===r&&o.c===c))return {r,c};nq.push({r,c});}}q=nq;}
 return pos;}
/* Resolución: rochas ao comezo, todos se levantan á vez e aterran un a un na orde da rolda, enroques ao final */
function resolve(){
 const P=S.players,order=S.rorder.slice();
 const log=[{k:'round',n:S.round},{k:'orderNow',list:order}],snaps=[],steps=[],rocks=[],promos=[];
 order.forEach(i=>{const h=S.plans[i].hole;if(!h||holeAt(h.r,h.c)||P.some(q=>q.pos.r===h.r&&q.pos.c===h.c))return;
  S.holes.push({r:h.r,c:h.c,ttl:6,born:S.round});rocks.push(h);log.push({k:'rock',p:i});S.chests=S.chests.filter(k=>!(k.r===h.r&&k.c===h.c));});
 P.forEach(p=>{const pl=S.plans[p.i];if(pl.dest2||pl.hole||pl.enroque!=null)p.pu=null;
  if(pl.type){p.rest[pl.type]=p.restBase[pl.type]+1;if(pl.type==='P')p.firstPawn=false;}});
 const start=P.map(p=>({r:p.pos.r,c:p.pos.c}));
 const cur=P.map(p=>({r:p.pos.r,c:p.pos.c,look:p.look,on:!S.plans[p.i].type}));
 const eaten=P.map(()=>false);
 const snap=()=>cur.map(o=>({r:o.r,c:o.c,look:o.look}));
 const occAt=(r,c,ex)=>cur.findIndex((o,j)=>j!==ex&&o.on&&o.r===r&&o.c===c);
 function hit(i,v,at,step){
  if(P[v].shield>0){P[v].shield=0;log.push({k:'shieldLog',a:i,b:v});step.shieldAt={r:at.r,c:at.c};
   let back={r:start[i].r,c:start[i].c};if(occAt(back.r,back.c,i)>=0)back=retreatFrom(back,i,cur);
   cur[i].r=back.r;cur[i].c=back.c;step.pts.push({r:back.r,c:back.c});return false;}
  eaten[v]=true;const vt=cur[v].look;log.push({k:'eat',a:i,b:v});
  const u=P[v].units.find(u=>u.t===vt&&!u.lost);if(u){u.lost=true;log.push({k:'lose',p:v,x:vt});}
  let back={r:start[v].r,c:start[v].c};
  if((back.r===at.r&&back.c===at.c)||occAt(back.r,back.c,v)>=0)back=retreatFrom(back,v,cur);
  cur[v].r=back.r;cur[v].c=back.c;step.victim=v;step.vTo={r:back.r,c:back.c};return true;}
 for(const i of order){
  const pl=S.plans[i];if(!pl.type)continue;
  snaps.push(snap());
  const from=start[i],step={i,type:pl.type,pts:[{r:from.r,c:from.c}],victim:-1,vTo:null,flyFrom:-1};
  cur[i].look=pl.type;cur[i].on=true;
  let pos={r:from.r,c:from.c},stop=false,bounced=false;
  const legs=[pl.dest];if(pl.dest2)legs.push(pl.dest2);
  for(let li=0;li<legs.length&&!stop;li++){
   let to={r:legs[li].r,c:legs[li].c};
   const md=Math.abs(to.r-pos.r)+Math.abs(to.c-pos.c);
   const straight=to.r===pos.r||to.c===pos.c;
   const pawnStraight=pl.type==='P'&&straight;
   const slide=pl.type==='T'||pl.type==='A'||pl.type==='D'||(pawnStraight&&md===2);
   if(slide){const dr=Math.sign(to.r-pos.r),dc=Math.sign(to.c-pos.c);let r=pos.r,c=pos.c,last={r,c};
    while(true){r+=dr;c+=dc;if(r===to.r&&c===to.c)break;
     if(holeAt(r,c)){to=last;stop=true;break;}
     if(occAt(r,c,i)>=0){if(pawnStraight){to=last;stop=true;}else{to={r,c};stop=true;}break;}
     last={r,c};}}
   if(holeAt(to.r,to.c)){to=pos;stop=true;}
   let v=(to.r===pos.r&&to.c===pos.c)?-1:occAt(to.r,to.c,i);
   if(v>=0&&pawnStraight){log.push({k:'bump',p:i});stop=true;to=pos;v=-1;}
   cur[i].r=to.r;cur[i].c=to.c;
   if(!(to.r===pos.r&&to.c===pos.c))step.pts.push({r:to.r,c:to.c});
   if(v>=0){stop=true;if(!hit(i,v,to,step))bounced=true;}
   pos={r:cur[i].r,c:cur[i].c};
  }
  const k=catAt(pos.r,pos.c);
  if(pl.type==='P'&&k&&!bounced){
   const to={r:k.to.r,c:k.to.c};
   if(!holeAt(to.r,to.c)){log.push({k:'fly',p:i});step.flyFrom=step.pts.length-1;cur[i].r=to.r;cur[i].c=to.c;step.pts.push({r:to.r,c:to.c});pos=to;
    const v=occAt(to.r,to.c,i);if(v>=0&&step.victim<0)hit(i,v,to,step);}}
  const o=occAt(cur[i].r,cur[i].c,i);
  if(o>=0&&step.victim!==o){const b=retreatFrom({r:cur[i].r,c:cur[i].c},i,cur);cur[i].r=b.r;cur[i].c=b.c;step.pts.push({r:b.r,c:b.c});}
  if(pl.type==='P'&&!P[i].promoted&&dist[from.r][from.c]>HALF&&dist[cur[i].r][cur[i].c]<=HALF){P[i].promoted=true;promos.push(i);log.push({k:'promo0',p:i});}
  steps.push(step);
 }
 for(const i of order){const pl=S.plans[i];if(pl.enroque==null)continue;const j=pl.enroque;
  snaps.push(snap());const a={r:cur[i].r,c:cur[i].c},b={r:cur[j].r,c:cur[j].c};
  cur[i].r=b.r;cur[i].c=b.c;cur[j].r=a.r;cur[j].c=a.c;cur[i].on=true;
  steps.push({i,swap:j,pts:[a,b],type:null,victim:-1,flyFrom:-1});log.push({k:'castle',a:i,b:j});}
 snaps.push(snap());
 const picks=[];
 order.forEach(i=>{const o=cur[i];const ci=S.chests.findIndex(k=>k.r===o.r&&k.c===o.c);if(ci<0)return;
  const t=['carga','derrumbe','escudo','enroque'][Math.floor(Math.random()*4)];
  S.chests.splice(ci,1);picks.push({i,t});log.push({k:'chest',p:i,u:t});});
 let winner=-1;
 for(const i of order){const pl=S.plans[i];if(!pl.type||eaten[i])continue;
  const occ=new Set();cur.forEach((o,j)=>{if(j!==i)occ.add(key(o.r,o.c));});
  if(attacksKing(pl.type,cur[i],occ)){winner=i;break;}}
 if(winner>=0)log.push({k:'win',p:winner});
 return {cur,log,snaps,steps,winner,rocks,picks,promos};
}

 a.total=a.pre+res.steps.reduce((t,st)=>t+a.d1*Math.max(1,st.pts.length-1)+(st.victim>=0?a.d2:0),0)+(res.steps.length?0:250);

}
function promoOptions(p){const o=[];const lost=p.units.filter(u=>u.lost).sort((a,b)=>VAL[b.t]-VAL[a.t])[0];

 res.picks.forEach(({i,t})=>{if(t==='escudo')P[i].shield=4;else P[i].pu={t,ttl:4};});
 S.log=res.log;S.anim=null;S.rockQ=null;S.catFired=null;

 if(res.winner>=0||S.round>=90){S.phase='end';renderPanel();renderEnd(res.winner);show('#ovEnd');return;}
